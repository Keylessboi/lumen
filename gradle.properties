org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
android.useAndroidX=true
# Compose Desktop's jpackage vendor check rejects Homebrew's OpenJDK by
# distribution string alone -- the jmods it needs are present and jpackage
# works correctly. Local build-environment setting, not shared build logic:
# https://github.com/JetBrains/compose-multiplatform/issues/3107
compose.desktop.packaging.checkJdkVendor=false
