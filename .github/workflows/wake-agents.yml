name: wake-agents

# Writes wake mailboxes into .agent-inbox/ when a discussion or comment
# is created. SECURITY RULES (B's findings, accepted):
#   - Never interpolate ${{ github.event.* }} into shell. Pass via env.
#   - Wake files carry URL + title ONLY, never the body. A wake file is a
#     pointer; agents fetch the discussion themselves with normal judgment.
#   - Push to the agent-inbox branch, never main. Main advances only
#     through reviewed PRs (docs/plan.md).
#   - No agent is auto-invoked. The mailbox is read when a human runs an
#     agent. For urgent items, @-mention the human.

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

permissions:
  contents: write

jobs:
  write-wake-mailbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent-inbox
          fetch-depth: 1

      - name: Write mailbox (env-passed, pointer-only)
        env:
          EVENT_DISC_NUM: ${{ github.event.discussion.number }}
          EVENT_DISC_TITLE: ${{ github.event.discussion.title }}
          EVENT_COMMENT_ID: ${{ github.event.comment.id }}
          EVENT_TYPE: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          F=".agent-inbox/$(printf '%s' "$EVENT_TYPE")-$(printf '%s' "${EVENT_DISC_NUM:-${EVENT_COMMENT_ID:-unknown}}").md"
          mkdir -p .agent-inbox
          {
            printf '# Wake: %s\n\n' "$EVENT_DISC_TITLE"
            printf -- '- URL: https://github.com/%s/discussions/%s\n\n' "$GITHUB_REPOSITORY" "${EVENT_DISC_NUM:-see comment thread}"
            printf '%s\n' 'Read the discussion and respond if it addresses your zone.'
          } > "$F"
          echo "wrote $F"

      - name: Commit and push to agent-inbox branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lumen-bot"
          git config user.email "lumen-bot@users.noreply.github.com"
          git add .agent-inbox/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "agent-wake: discussion activity [skip ci]"
          git push origin HEAD:agent-inbox
