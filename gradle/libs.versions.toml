# Version catalog — single source of truth for dependency versions.
# Owner: shared (either agent, changes require other's review).

[versions]
kotlin = "2.2.10"
agp = "8.9.2"
compose-multiplatform = "1.8.2"
androidx-activity = "1.10.1"
androidx-lifecycle = "2.9.0"
sqldelight = "2.0.2"
sqlite-jdbc = "3.45.2.0"
kotlinx-coroutines = "1.10.1"
kotlinx-serialization = "1.8.0"
kotlinx-datetime = "0.6.2"
libsodium = "0.2.0"
# Bouncy Castle: Argon2id for the M5 export KDF, and AES-GCM where the
# platform's own provider is not preferable. Chosen over de.mkammerer:argon2-jvm
# because that one ships a native libsodium via JNA — a per-architecture binary
# in the distribution and a second native surface to sign and notarize on
# macOS. BC is pure Java: slower, but the KDF is deliberately slow anyway, and
# an export is a once-in-a-while operation, not a hot path.
bouncycastle = "1.78.1"
junit = "4.13.2"
# Smack: the JVM XMPP client stack (M4 transport). Pure Java, no native
# deps — fits the same "no per-arch binaries in the distribution" rule that
# chose Bouncy Castle over a JNA libsodium.
smack = "4.4.8"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-jvm-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
# Raw JDBC access for app-macos's read-only import of the macOS Knowledge
# store (knowledgeC.db). Not for app data — that goes through SQLDelight.
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
libsodium-jni = { module = "org.abstractj.kalium:kalium", version.ref = "libsodium" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
junit = { module = "junit:junit", version.ref = "junit" }
# Smack (M4 transport): core + TCP + extensions (MAM/IBR live in extensions).
smack-core = { module = "org.igniterealtime.smack:smack-core", version.ref = "smack" }
smack-tcp = { module = "org.igniterealtime.smack:smack-tcp", version.ref = "smack" }
smack-extensions = { module = "org.igniterealtime.smack:smack-extensions", version.ref = "smack" }
# StAX backend: smack-xmlparser is the SPI interface only; without a concrete
# parser (xpp3 or stax) Smack fails at init with "No XmlPullParserFactory
# registered with Service Provider Interface".
smack-xmlparser-stax = { module = "org.igniterealtime.smack:smack-xmlparser-stax", version.ref = "smack" }
# MiniDNS resolver: without it DNSUtil.getDNSResolver() is null and TCP
# connect fails with an NPE before any packet is sent.
smack-resolver-minidns = { module = "org.igniterealtime.smack:smack-resolver-minidns", version.ref = "smack" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
